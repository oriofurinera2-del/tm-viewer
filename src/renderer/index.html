<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TM Viewer</title>
  <link rel="stylesheet" href="renderer.css">
</head>
<body>
  <header>
    <span class="app-name">TM Viewer</span>
    <nav aria-label="画面">
      <button type="button" data-view="feed">フィード</button>
      <button type="button" data-view="organized">整理した動画</button>
      <button type="button" data-view="site" class="active">サイト表示</button>
      <button type="button" data-view="downloads">ダウンロード</button>
      <button type="button" data-view="settings">設定</button>
    </nav>
  </header>

  <main>
    <section id="feed" hidden>
      <aside id="people-panel">
        <label class="visually-hidden" for="person-search">名前で絞り込み</label>
        <input id="person-search" type="search" placeholder="名前で絞り込み">
        <div id="people"></div>
      </aside>
      <div id="feed-content">
        <div class="feed-tools">
          <button type="button" id="refresh-feed">更新</button>
          <span id="feed-progress" role="status"></span>
          <label><input id="viewable-only" type="checkbox" checked> 見られる動画だけ</label>
          <label><input id="include-subscriptions" type="checkbox" checked> 購読を含める</label>
          <span class="download-status" role="status"></span>
        </div>
        <h1 id="feed-title">すべて</h1>
        <div id="feed-pager-top" class="pager"></div>
        <div id="feed-grid"></div>
        <div id="feed-pager-bottom" class="pager"></div>
      </div>
    </section>

    <section id="organized" hidden>
      <div class="feed-tools">
        <span class="filter-label">独自タグ</span>
        <div id="org-tags" class="chips"></div>
        <span class="filter-label">サイトのタグ</span>
        <select id="org-site-tag"><option value="">指定なし</option></select>
        <label>得点
          <select id="org-min">
            <option value="0">指定なし</option>
            <option value="5">★5</option>
            <option value="4">★4 以上</option>
            <option value="3">★3 以上</option>
            <option value="2">★2 以上</option>
            <option value="1">★1 以上</option>
          </select>
        </label>
        <label>並べ替え
          <select id="org-sort">
            <option value="score">得点順</option>
            <option value="added">付けた順</option>
          </select>
        </label>
        <span id="org-count" class="filter-label"></span>
      </div>
      <div id="org-pager-top" class="pager"></div>
      <div id="org-grid"></div>
      <div id="org-pager-bottom" class="pager"></div>
    </section>

    <section id="site">
      <div class="appbar" id="site-toolbar">
        <button type="button" id="to-feed">← フィードへ戻る</button>
        <button type="button" id="back" title="戻る" aria-label="戻る">◀</button>
        <button type="button" id="forward" title="進む" aria-label="進む">▶</button>
        <form id="address-form">
          <label class="visually-hidden" for="address">アドレス</label>
          <input id="address" type="url" autocomplete="off" spellcheck="false" value="https://www.tokyomotion.net/">
        </form>
        <button type="button" id="download-current" disabled>ダウンロード</button>
        <span class="download-status" role="status"></span>
        <span>広告遮断中</span>
      </div>
      <div class="metabar" id="site-metabar" hidden></div>
      <div id="site-area" aria-label="TOKYO Motion のサイト表示"></div>
    </section>

    <section id="downloads" hidden>
      <div id="downloads-list"></div>
    </section>

    <section id="settings" hidden>
      <h1>設定</h1>

      <div class="settings-group">
        <h2>ダウンロード・整理データ</h2>
        <button type="button" id="download-dir">保存先…</button>
        <button type="button" id="notes-export">整理データを書き出す</button>
        <button type="button" id="notes-import">整理データを読み込む</button>
        <span class="download-status" role="status"></span>
      </div>

      <div class="settings-group" id="credentials-group">
        <h2>ログイン情報の保存</h2>
        <p id="credentials-unavailable" hidden>この環境では使えません。</p>
        <div id="credentials-form">
          <label><input id="credentials-enabled" type="checkbox"> ログイン情報を保存して自動でログインする</label>
          <ul class="credentials-warning">
            <li>他人と共有している PC では使わない</li>
            <li>このサイト専用の（他で使い回していない）パスワードにする</li>
          </ul>
          <div id="credentials-inputs" hidden>
            <label class="field"><span class="lbl">ID</span><input id="credentials-id" type="text" autocomplete="off"></label>
            <label class="field"><span class="lbl">パスワード</span><input id="credentials-password" type="password" autocomplete="off"></label>
            <button type="button" id="credentials-save">保存</button>
          </div>
          <button type="button" id="credentials-clear" hidden>保存した情報を削除</button>
          <span id="credentials-status" role="status"></span>
        </div>
      </div>
    </section>
  </main>
  <script src="renderer.js"></script>
</body>
</html>
