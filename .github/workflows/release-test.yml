name: Build test release

# 注意（自動更新の前提）: electron-updater はバージョン比較で更新を検知する。
# 自動更新を正しく通すには、リリースは package.json の version と一致する semver タグ
# （例 v0.1.0）で、prerelease ではなく通常リリースにするのが基本。
# 下のトリガ 'v*-test.*' は動作確認用の prerelease タグで、バージョン不一致＆prerelease の
# ため自動更新は検知しないことがある（あくまでビルド確認用）。実際の自動更新を伴う配布は、
# package.json の version に合わせた v<version> の通常リリースで行うこと。
on:
  push:
    tags:
      - 'v*-test.*'
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check source and run tests
        run: |
          npm run check
          npm test

      # electron-builder はビルドのみ（--publish はしない）。
      # electron-builder の publish は稀に同じタグで重複リリースを作り、latest.yml の
      # 無い方が「Latest」になって自動更新が壊れる。確実な単一リリースにするため、
      # 生成物（インストーラ・latest.yml・blockmap）を gh で 1 つのリリースにまとめて出す。
      - name: Build NSIS installer
        run: npx electron-builder --win --x64

      - name: Publish single release with all assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem 'dist/*.exe', 'dist/*.blockmap', 'dist/latest.yml' | ForEach-Object { $_.FullName }
          if (-not ($files | Where-Object { $_ -like '*latest.yml' })) { throw 'latest.yml が生成されていません' }
          $notes = "Windows x64 向け。setup の .exe を実行してインストールしてください。未署名のため SmartScreen 警告が出たら「詳細情報 → 実行」。以降はアプリ内の自動更新で更新されます。"
          gh release create "$env:GITHUB_REF_NAME" $files --repo "$env:GITHUB_REPOSITORY" --title "$env:GITHUB_REF_NAME" --notes "$notes" --latest

      # 公開したインストーラ（.exe）にビルド証明を付ける。
      - name: Attest the installer
        uses: actions/attest@v4
        with:
          subject-path: dist/*.exe
