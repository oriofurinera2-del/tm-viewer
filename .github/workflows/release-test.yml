name: Build test release

on:
  push:
    tags:
      - 'v*-test.*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check source and run tests
        run: |
          npm run check
          npm test

      - name: Build portable executable
        run: npm run dist

      - name: Package executable
        shell: pwsh
        run: |
          $appName = (Get-Content 'package.json' -Raw | ConvertFrom-Json).build.productName
          $exePath = "dist/$appName.exe"
          $zipPath = "dist/$appName-$env:GITHUB_REF_NAME.zip"
          if (-not (Test-Path -LiteralPath $exePath)) { throw "Built executable not found: $exePath" }
          Compress-Archive -LiteralPath $exePath -DestinationPath $zipPath

      - name: Attest the downloadable ZIP
        uses: actions/attest@v4
        with:
          subject-path: dist/*.zip

      - name: Publish test release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $appName = (Get-Content 'package.json' -Raw | ConvertFrom-Json).build.productName
          $zipPath = "dist/$appName-$env:GITHUB_REF_NAME.zip"
          $runUrl = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
          $notes = "Windows x64 向けのテスト版です。ZIPを展開し、exeを起動してください。公開コードからGitHub上でビルドしています。ビルド記録: $runUrl 配布ZIPのビルド証明も記録しています。アプリ内検索は開発中で、実サイトでの通し確認はこれからです。未署名のためWindowsの警告が出る場合があります。"
          gh release create "$env:GITHUB_REF_NAME" "$zipPath" --repo "$env:GITHUB_REPOSITORY" --verify-tag --prerelease --title "$appName $env:GITHUB_REF_NAME テスト版" --notes "$notes"
