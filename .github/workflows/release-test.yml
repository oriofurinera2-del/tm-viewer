name: Build test release

# 注意（自動更新の前提）: electron-updater はバージョン比較で更新を検知する。
# 自動更新を正しく通すには、リリースは package.json の version と一致する semver タグ
# （例 v0.1.0）で、prerelease ではなく通常リリースにするのが基本。
# 下のトリガ 'v*-test.*' は動作確認用の prerelease タグで、バージョン不一致＆prerelease の
# ため自動更新は検知しないことがある（あくまでビルド確認用）。実際の自動更新を伴う配布は、
# package.json の version に合わせた v<version> の通常リリースで行うこと。
on:
  push:
    tags:
      - 'v*-test.*'
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check source and run tests
        run: |
          npm run check
          npm test

      # electron-builder が NSIS インストーラ・latest.yml・blockmap を生成し、
      # GitHub Release に自動アップロードする（--publish always）。
      # electron-updater が更新確認に読むのは latest.yml。
      - name: Build and publish NSIS installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: npx electron-builder --win --x64 --publish always

      # 生成された NSIS インストーラ（.exe）にビルド証明を付ける。
      - name: Attest the installer
        uses: actions/attest@v4
        with:
          subject-path: dist/*.exe
